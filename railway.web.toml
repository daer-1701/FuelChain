# @fuelchain/web — Config-as-code (solo este servicio)
# En Railway: Settings → Config-as-code → Path: railway.web.toml
# O Settings → Build → Dockerfile path: Dockerfile.web

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

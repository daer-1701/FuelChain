# Default Config-as-code for @fuelchain/api
# Web must override in Settings → Build → Dockerfile path: Dockerfile.web
# (or Config-as-code path: railway.web.toml)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

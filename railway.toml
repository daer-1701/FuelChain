# Railway — servicio API (root del monorepo)
# Dashboard: New Project → Deploy from GitHub → este repo
# Luego: + Postgres y linkear DATABASE_URL
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# @fuelchain/api — Config-as-code (solo este servicio debe usarlo)
# En Railway: Settings → Config-as-code → Path: railway.api.toml
# O Settings → Build → Dockerfile path: Dockerfile.api

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
